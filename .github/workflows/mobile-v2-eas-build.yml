name: Mobile V2 Production AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Expo access token
        run: test -n "$EXPO_TOKEN"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify Expo project link
        run: eas project:info --non-interactive
      - name: Validate source
        run: npm run check
      - name: Build signed Google Play AAB
        run: eas build --platform android --profile production --non-interactive --wait --json > eas-build-production.json
      - name: Upload build receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-v2-production-aab-receipt
          path: mobile/eas-build-production.json
          if-no-files-found: ignore
          retention-days: 30

name: Mobile V2 EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: mobile-v2-eas-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_MADAR_API_URL: https://www.orbitmadar.com
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_RELEASE_CHANNEL: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify build secrets
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed Android artifact
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait --json > eas-build-result.json
      - name: Upload build receipt
        uses: actions/upload-artifact@v4
        with:
          name: mobile-v2-${{ inputs.profile }}-build-receipt
          path: mobile/eas-build-result.json
          retention-days: 30

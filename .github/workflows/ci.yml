name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate ORBY Stage 4 sources
        if: ${{ hashFiles('scripts/bootstrap-orby-stage4.mjs') != '' }}
        run: node scripts/bootstrap-orby-stage4.mjs
      - name: Pack generated ORBY Stage 4 sources
        if: ${{ hashFiles('scripts/bootstrap-orby-stage4.mjs') != '' }}
        shell: bash
        run: |
          tar -czf orby-stage4-generated.tar.gz \
            package.json \
            components/admin/EnterpriseAdminShell.tsx \
            src/lib/orby/index.ts \
            src/lib/orby/os \
            supabase/migrations/20260729190000_orby_os_v1.sql \
            app/admin/orby-os \
            app/api/orby/os \
            scripts/run-orby-stage-4-smoke.ts \
            tests/orby-stage-4-orby-os.test.mjs \
            docs/orby-stage-4-orby-os.md
      - name: Upload generated ORBY Stage 4 sources
        if: ${{ hashFiles('orby-stage4-generated.tar.gz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: orby-stage4-generated
          path: orby-stage4-generated.tar.gz
          retention-days: 3
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee test.log
      - name: Run ORBY OS smoke suite
        shell: bash
        run: set -o pipefail; npm run orby:os-smoke 2>&1 | tee orby-os-smoke.log
      - name: Lint
        shell: bash
        run: set -o pipefail; npm run lint 2>&1 | tee lint.log
      - name: Typecheck
        shell: bash
        run: set -o pipefail; npm run typecheck 2>&1 | tee typecheck.log
      - name: Build
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee build.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            test.log
            orby-os-smoke.log
            lint.log
            typecheck.log
            build.log
          if-no-files-found: ignore
          retention-days: 3

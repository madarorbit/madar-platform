name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify authoritative MADAR image masters
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          verify_asset() {
            local path="$1" blob="$2"
            test -s "$path"
            test "$(git hash-object "$path")" = "$blob"
          }
          verify_asset public/assets/services/native-business-master.png 5b23af11150f65fe8c79ebce1626468780284984
          verify_asset public/assets/services/madar-retail-master.png 41dec7e503401f8a39c5d92e9f475feef9a66d78
          verify_asset public/assets/services/connected-business-master.png 34d43f28b9e23ed95e9940b552da55738408b16f
          verify_asset public/assets/orby/orby-master.png a213830b95960f5118596635ce5dd2328a853dbf
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee test.log
      - name: Run ORBY OS smoke suite
        shell: bash
        run: set -o pipefail; npm run orby:os-smoke 2>&1 | tee orby-os-smoke.log
      - name: Run ORBY OS security suite
        shell: bash
        run: set -o pipefail; npm run orby:os-security 2>&1 | tee orby-os-security.log
      - name: Run ORBY OS load suite
        shell: bash
        run: set -o pipefail; npm run orby:os-load 2>&1 | tee orby-os-load.log
      - name: Lint
        if: ${{ !cancelled() }}
        shell: bash
        run: set -o pipefail; npm run lint 2>&1 | tee lint.log
      - name: Typecheck
        if: ${{ !cancelled() }}
        shell: bash
        run: set -o pipefail; npm run typecheck 2>&1 | tee typecheck.log
      - name: Build
        if: ${{ !cancelled() }}
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee build.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            test.log
            orby-os-smoke.log
            orby-os-security.log
            orby-os-load.log
            lint.log
            typecheck.log
            build.log
          if-no-files-found: ignore
          retention-days: 3

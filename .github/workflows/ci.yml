name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify checked-in Phase 8 binary assets
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          verify_asset() {
            local path="$1" bytes="$2" sha256="$3"
            test -f "$path"
            test "$(wc -c < "$path" | tr -d ' ')" = "$bytes"
            test "$(head -c 4 "$path")" = "RIFF"
            test "$(dd if="$path" bs=1 skip=8 count=4 status=none)" = "WEBP"
            echo "${sha256}  ${path}" | sha256sum --check --strict
          }
          verify_asset public/assets/services/native-business-master.webp 91016 083032838be4edb638d384975a9a667f849b187665512ae2fe4fb423523842ed
          verify_asset public/assets/services/madar-retail-master.webp 83354 0f781f4bf2a30507acd24b96fd0c318e76ecb655cbe4a69cacd025fd9d8a4691
          verify_asset public/assets/services/connected-business-master.webp 77790 11ce11a0361357138dcfc3a31a6fdda7359ffddc73f342716f2c4ff3271c9bd8
          verify_asset public/assets/orby/orby-master.webp 65714 c90707f8f966ccea28c8e7a0c7bcb51feb1446115d9fc5003864c75cf92d92e9
      - name: Patch immutable ORBY OS scope keys
        if: ${{ hashFiles('scripts/fix-orby-stage4-scope-keys.mjs') != '' }}
        run: node scripts/fix-orby-stage4-scope-keys.mjs
      - name: Commit generated migration correction
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/orby-stage-4-orby-os' }}
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "madarorbit"
          git config user.email "orbit.ops.digital@gmail.com"
          git add supabase/migrations/20260729190000_orby_os_v1.sql
          git commit -m "Use immutable ORBY OS scope keys"
          git push origin HEAD:codex/orby-stage-4-orby-os
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee test.log
      - name: Run ORBY OS smoke suite
        shell: bash
        run: set -o pipefail; npm run orby:os-smoke 2>&1 | tee orby-os-smoke.log
      - name: Run ORBY OS security suite
        shell: bash
        run: set -o pipefail; npm run orby:os-security 2>&1 | tee orby-os-security.log
      - name: Run ORBY OS load suite
        shell: bash
        run: set -o pipefail; npm run orby:os-load 2>&1 | tee orby-os-load.log
      - name: Lint
        shell: bash
        run: set -o pipefail; npm run lint 2>&1 | tee lint.log
      - name: Typecheck
        shell: bash
        run: set -o pipefail; npm run typecheck 2>&1 | tee typecheck.log
      - name: Build
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee build.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            test.log
            orby-os-smoke.log
            orby-os-security.log
            orby-os-load.log
            lint.log
            typecheck.log
            build.log
          if-no-files-found: ignore
          retention-days: 3

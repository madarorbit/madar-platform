name: Mobile V2 Signed Android Release

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'app/mobile/page.tsx'
      - 'app/dashboard-app/page.tsx'
      - '.github/workflows/mobile-v2-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: mobile-v2-signed-release
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RELEASE_TAG: mobile-v2-stable
      RELEASE_ASSET: MADAR-Mobile.apk
    steps:
      - uses: actions/checkout@v4
      - name: Mark signed mobile release as pending
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f context='MADAR Mobile EAS Release' \
            -f description='Building and validating the signed Android release' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Expo access
        run: test -n "$EXPO_TOKEN"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify linked Expo project
        run: eas project:info --non-interactive
      - name: Validate the production source
        run: |
          npm run typecheck
          npm run lint
          npm run doctor
          npm run export:android
      - name: Build signed standalone APK with EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build-preview.json
      - name: Resolve and download the EAS artifact
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('eas-build-preview.json', 'utf8'));
          const build = Array.isArray(payload) ? payload[0] : payload;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url || !String(url).startsWith('https://')) throw new Error('EAS build did not return a downloadable Android artifact.');
          fs.writeFileSync('eas-build-url.txt', String(url));
          fs.writeFileSync('eas-build-id.txt', String(build?.id || 'unknown'));
          NODE
          curl --fail --location --retry 4 --retry-all-errors "$(cat eas-build-url.txt)" --output "$RELEASE_ASSET"
      - name: Validate standalone release APK
        run: |
          test -s "$RELEASE_ASSET"
          unzip -tq "$RELEASE_ASSET"
          BYTES="$(stat -c%s "$RELEASE_ASSET")"
          test "$BYTES" -ge 5000000
          test "$BYTES" -le 100000000
          sha256sum "$RELEASE_ASSET" > "$RELEASE_ASSET.sha256"
          printf 'EAS_BUILD_ID=%s\nAPK_BYTES=%s\n' "$(cat eas-build-id.txt)" "$BYTES" > release-metadata.txt
          cat release-metadata.txt
          cat "$RELEASE_ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: MADAR-Mobile-2.1.0-signed-APK
          path: |
            mobile/MADAR-Mobile.apk
            mobile/MADAR-Mobile.apk.sha256
            mobile/eas-build-preview.json
            mobile/release-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable public download
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='إصدار Android 2.1.0 الموقّع من مشروع مَدار موبايل على Expo/EAS. يتضمن إصلاح التوقف عند شاشة الشعار، مهلة واستعادة آمنة للإقلاع، إعداد جلسة ثابت، وبناء Release مصغّر بدل Debug.'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "mobile/$RELEASE_ASSET" \
              "mobile/$RELEASE_ASSET.sha256" \
              "mobile/release-metadata.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'مَدار موبايل 2.1.0' \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              "mobile/$RELEASE_ASSET" \
              "mobile/$RELEASE_ASSET.sha256" \
              "mobile/release-metadata.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'مَدار موبايل 2.1.0' \
              --notes "$NOTES" \
              --latest
          fi
      - name: Publish final mobile release status
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            STATE='success'
            DESCRIPTION='Signed Android release validated and published'
          else
            STATE='failure'
            DESCRIPTION='Signed Android release failed; inspect the workflow'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='MADAR Mobile EAS Release' \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

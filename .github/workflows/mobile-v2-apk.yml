name: Mobile V2 Android APK

on:
  push:
    branches: [main, codex/madar-v2-mobile-dashboard-a0-a7]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - '.github/workflows/mobile-v2-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-v2-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_MADAR_API_URL: https://www.orbitmadar.com
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_RELEASE_CHANNEL: beta
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify public runtime configuration
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript and Expo
        run: |
          npm run typecheck
          npm run lint
          npm run doctor
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build installable beta APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: mobile/android
      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MADAR-V2.0-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MADAR-V2.0-beta-APK
          path: mobile/MADAR-V2.0-beta.apk
          if-no-files-found: error
          retention-days: 30

name: Mobile V2 Android APK

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - '.github/workflows/mobile-v2-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - '.github/workflows/mobile-v2-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-v2-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_MADAR_API_URL: https://www.orbitmadar.com
      EXPO_PUBLIC_RELEASE_CHANNEL: beta
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript and Expo
        run: |
          npm run typecheck
          npm run lint
          npm run doctor
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build installable beta APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: mobile/android
      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MADAR-V2.0-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MADAR-V2.0-beta-APK
          path: mobile/MADAR-V2.0-beta.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable public beta download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mobile-v2-beta
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" mobile/MADAR-V2.0-beta.apk --clobber
          else
            gh release create "$RELEASE_TAG" mobile/MADAR-V2.0-beta.apk \
              --title "مَدار Android V2.0 Beta" \
              --notes "نسخة Android التجريبية الرسمية لحسابات الأعمال في منصة مَدار." \
              --prerelease
          fi

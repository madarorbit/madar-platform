name: Build MADAR Android APK Fallback

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/local-release-apk.yml'

permissions:
  contents: read

concurrency:
  group: madar-local-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-local-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify mobile project
        run: |
          npm run typecheck
          npx expo config --type public

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Validate standalone APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          unzip -l "$APK_PATH" | grep -E 'assets/(index\.android\.bundle|expo-root)'
          cp "$APK_PATH" madar-mobile-release.apk
          sha256sum madar-mobile-release.apk > madar-mobile-release.sha256
          ls -lh madar-mobile-release.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-mobile-release-apk-local
          path: |
            mobile/madar-mobile-release.apk
            mobile/madar-mobile-release.sha256
          if-no-files-found: error
          retention-days: 14

name: Build MADAR Prototype APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-apk.yml'

permissions:
  contents: read

concurrency:
  group: madar-prototype-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify mobile project
        run: |
          npm run typecheck
          npx expo-doctor@latest

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK artifact
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          cp "$APK_PATH" madar-mobile-prototype.apk
          sha256sum madar-mobile-prototype.apk > madar-mobile-prototype.sha256
          ls -lh madar-mobile-prototype.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: madar-mobile-prototype-apk
          path: |
            mobile/madar-mobile-prototype.apk
            mobile/madar-mobile-prototype.sha256
          if-no-files-found: error
          retention-days: 14

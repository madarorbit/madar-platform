name: Build MADAR Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-apk.yml'

permissions:
  contents: read

concurrency:
  group: madar-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo access
        run: |
          test -n "$EXPO_TOKEN" || { echo "Repository secret EXPO_TOKEN is missing."; exit 1; }
          npx eas-cli@latest whoami

      - name: Verify mobile project
        run: |
          npm run typecheck
          npx expo-doctor@latest
          npx expo config --type public

      - name: Link the EAS project
        run: npx eas-cli@latest init --force --non-interactive

      - name: Build standalone release APK
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Download and validate APK
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(value) ? value[0] : value;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || build?.artifactUrl;
          if (!url) {
            console.error(JSON.stringify(value, null, 2));
            throw new Error('EAS did not return an APK artifact URL.');
          }
          fs.writeFileSync('apk-url.txt', url);
          NODE
          curl --fail --location "$(cat apk-url.txt)" --output madar-mobile-release.apk
          test -s madar-mobile-release.apk
          unzip -l madar-mobile-release.apk | grep -E 'assets/(index\.android\.bundle|expo-root)'
          sha256sum madar-mobile-release.apk > madar-mobile-release.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-mobile-release-apk
          path: |
            mobile/madar-mobile-release.apk
            mobile/madar-mobile-release.sha256
            mobile/eas-build.json
          if-no-files-found: error
          retention-days: 14

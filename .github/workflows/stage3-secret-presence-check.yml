name: Stage 3 Secret Presence Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID_VALUE: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_VALUE: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_SERVICE_ROLE_KEY_VALUE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN_VALUE: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CRON_SECRET_VALUE: ${{ secrets.CRON_SECRET }}
      MADAR_INTEGRATION_WORKER_SECRET_VALUE: ${{ secrets.MADAR_INTEGRATION_WORKER_SECRET }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          for name in \
            VERCEL_TOKEN_VALUE \
            VERCEL_ORG_ID_VALUE \
            VERCEL_PROJECT_ID_VALUE \
            SUPABASE_SERVICE_ROLE_KEY_VALUE \
            SUPABASE_ACCESS_TOKEN_VALUE \
            CRON_SECRET_VALUE \
            MADAR_INTEGRATION_WORKER_SECRET_VALUE
          do
            if [ -n "${!name}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=ABSENT"
            fi
          done

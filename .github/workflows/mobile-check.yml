name: Mobile Client Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app/api/mobile/**'
      - 'app/api/orby/route.ts'
      - 'src/lib/supabase/server.ts'
      - 'tests/mobile-client.test.mjs'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app/api/mobile/**'
      - 'app/api/orby/route.ts'
      - 'src/lib/supabase/server.ts'
      - 'tests/mobile-client.test.mjs'

permissions:
  contents: read

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

name: Phase 8 Visual Closure V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase8-completion-v3.yml'

permissions:
  contents: write

concurrency:
  group: phase8-visual-closure-v3-main
  cancel-in-progress: false

jobs:
  close-phase-8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Restore and verify official binary assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          restore_blob() {
            local blob="$1" path="$2" bytes="$3" sha256="$4"
            mkdir -p "$(dirname "$path")"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" --jq '.content' | tr -d '\n' | base64 --decode > "$path"
            test "$(wc -c < "$path" | tr -d ' ')" = "$bytes"
            test "$(head -c 4 "$path")" = "RIFF"
            test "$(dd if="$path" bs=1 skip=8 count=4 status=none)" = "WEBP"
            echo "${sha256}  ${path}" | sha256sum --check --strict
          }
          restore_blob 88974d6af861e48edc3b583e783a3c2899297741 public/assets/services/native-business-master.webp 91016 083032838be4edb638d384975a9a667f849b187665512ae2fe4fb423523842ed
          restore_blob edccdeeb3e8906a632a0a8348fe46662b49401cc public/assets/services/madar-retail-master.webp 83354 0f781f4bf2a30507acd24b96fd0c318e76ecb655cbe4a69cacd025fd9d8a4691
          restore_blob 9f96c922c49908a57d209698f14401e6102dc773 public/assets/services/connected-business-master.webp 77790 11ce11a0361357138dcfc3a31a6fdda7359ffddc73f342716f2c4ff3271c9bd8
          restore_blob 9300911110b4c10274dc989fed5a4a6d497c0c97 public/assets/orby/orby-master.webp 65714 c90707f8f966ccea28c8e7a0c7bcb51feb1446115d9fc5003864c75cf92d92e9
      - name: Install dependencies
        run: npm ci
      - name: Apply AST-safe missing visual implementation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');
          const read = (p) => fs.readFileSync(p, 'utf8');
          const write = (p, value) => fs.writeFileSync(p, value);
          function applyEdits(source, edits) {
            return [...edits].sort((a,b)=>b.start-a.start).reduce((text,e)=>text.slice(0,e.start)+e.text+text.slice(e.end), source);
          }
          function addImport(source, statement) {
            if (source.includes(statement)) return source;
            const sf = ts.createSourceFile('file.tsx', source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            const imports = sf.statements.filter(ts.isImportDeclaration);
            const at = imports.length ? imports[imports.length-1].getEnd() : 0;
            return source.slice(0,at) + (at ? '\n' : '') + statement + '\n' + source.slice(at);
          }
          function rebuildIconImport(node, sf) {
            const clause = node.importClause;
            if (!clause) return '';
            const parts = [];
            if (clause.name) parts.push(clause.name.text);
            if (clause.namedBindings && ts.isNamedImports(clause.namedBindings)) {
              const kept = clause.namedBindings.elements.filter((el)=>el.name.text !== 'Icon');
              if (kept.length) {
                const named = kept.map((el)=>`${el.isTypeOnly ? 'type ' : ''}${el.propertyName ? `${el.propertyName.text} as ` : ''}${el.name.text}`).join(', ');
                parts.push(`{ ${named} }`);
              }
            }
            return parts.length ? `import ${parts.join(', ')} from "@/components/ui/Icons";` : '';
          }
          function patchConcept(file) {
            const source = read(file);
            if (source.includes('<MadarIllustration ')) return;
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            const edits=[];
            let iconImport=null;
            let count=0;
            function visit(node) {
              if (ts.isImportDeclaration(node) && ts.isStringLiteral(node.moduleSpecifier) && node.moduleSpecifier.text === '@/components/ui/Icons') iconImport=node;
              if (ts.isJsxSelfClosingElement(node) && node.tagName.getText(sf) === 'Icon') {
                const attr=node.attributes.properties.find((p)=>ts.isJsxAttribute(p) && p.name.getText(sf)==='name');
                if (!attr || !attr.initializer || !ts.isJsxExpression(attr.initializer) || !attr.initializer.expression) throw new Error(`${file}: Icon name expression not found`);
                const expr=attr.initializer.expression.getText(sf);
                edits.push({start:node.getStart(sf),end:node.getEnd(),text:`<MadarIllustration kind={illustrationKindFromIcon(${expr})} />`});
                count++;
              }
              ts.forEachChild(node,visit);
            }
            visit(sf);
            if (count !== 4) throw new Error(`${file}: expected four conceptual Icon elements, got ${count}`);
            if (!iconImport) throw new Error(`${file}: shared Icon import not found`);
            edits.push({start:iconImport.getStart(sf),end:iconImport.getEnd(),text:rebuildIconImport(iconImport,sf)});
            let output=applyEdits(source,edits);
            output=addImport(output,'import { MadarIllustration, illustrationKindFromIcon } from "@/components/ui/MadarIllustration";');
            write(file,output);
          }
          patchConcept('components/home/WhyMadar.tsx');
          patchConcept('components/home/Categories.tsx');

          let theme=read('components/theme/ThemeToggle.tsx');
          if (!theme.includes('name="sun"') || !theme.includes('name="moon"')) {
            const sf=ts.createSourceFile('ThemeToggle.tsx',theme,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
            const svgs=[];
            function visit(node){
              if(ts.isJsxElement(node) && node.openingElement.tagName.getText(sf)==='svg') svgs.push(node);
              ts.forEachChild(node,visit);
            }
            visit(sf);
            svgs.sort((a,b)=>a.getStart(sf)-b.getStart(sf));
            if(svgs.length!==2) throw new Error(`ThemeToggle: expected two functional SVGs, got ${svgs.length}`);
            theme=applyEdits(theme,[
              {start:svgs[0].getStart(sf),end:svgs[0].getEnd(),text:'<Icon name="sun" className="h-4 w-4" />'},
              {start:svgs[1].getStart(sf),end:svgs[1].getEnd(),text:'<Icon name="moon" className="h-4 w-4" />'},
            ]);
            theme=addImport(theme,'import { Icon } from "@/components/ui/Icons";');
            write('components/theme/ThemeToggle.tsx',theme);
          }

          const illustration = `import type { SVGProps } from "react";

export type MadarIllustrationKind = "operations" | "automation" | "intelligence" | "security";

export function illustrationKindFromIcon(icon: string): MadarIllustrationKind {
  if (icon === "automation") return "automation";
  if (icon === "sparkles") return "intelligence";
  if (icon === "shield") return "security";
  return "operations";
}

function Motif({ kind }: { kind: MadarIllustrationKind }) {
  if (kind === "automation") return <>
    <g className="md-illustration-secondary"><path d="M18 36h17M61 22h17M61 50h17"/><path d="m31 31 6 5-6 5M74 17l6 5-6 5M74 45l6 5-6 5"/></g>
    <g className="md-illustration-primary"><circle cx="14" cy="36" r="6"/><circle cx="48" cy="36" r="10"/><path d="M42 30l12 12M54 30 42 42"/></g>
    <g className="md-illustration-node"><circle cx="86" cy="22" r="4"/><circle cx="86" cy="50" r="4"/></g>
  </>;
  if (kind === "intelligence") return <>
    <g className="md-illustration-secondary"><circle cx="48" cy="36" r="25"/><path d="M48 7v8M48 57v8M19 36h8M69 36h8"/></g>
    <g className="md-illustration-primary"><path d="m48 20 4.5 11.5L64 36l-11.5 4.5L48 52l-4.5-11.5L32 36l11.5-4.5L48 20Z"/></g>
    <g className="md-illustration-node"><circle cx="22" cy="18" r="4"/><circle cx="74" cy="54" r="4"/></g>
  </>;
  if (kind === "security") return <>
    <g className="md-illustration-secondary"><path d="M22 18h13M61 18h13M22 54h13M61 54h13"/></g>
    <g className="md-illustration-primary"><path d="M48 13 65 20v14c0 13-7 21-17 26-10-5-17-13-17-26V20l17-7Z"/><path d="m40 36 6 6 11-13"/></g>
    <g className="md-illustration-node"><circle cx="17" cy="18" r="4"/><circle cx="79" cy="18" r="4"/><circle cx="17" cy="54" r="4"/><circle cx="79" cy="54" r="4"/></g>
  </>;
  return <>
    <g className="md-illustration-secondary"><path d="M20 22h18M58 22h18M20 50h18M58 50h18"/><path d="M48 23v26"/></g>
    <g className="md-illustration-primary"><rect x="34" y="24" width="28" height="24" rx="7"/><path d="M41 32h14M41 40h9"/></g>
    <g className="md-illustration-node"><circle cx="15" cy="22" r="4"/><circle cx="81" cy="22" r="4"/><circle cx="15" cy="50" r="4"/><circle cx="81" cy="50" r="4"/></g>
  </>;
}

export function MadarIllustration({ kind, className = "", ...props }: { kind: MadarIllustrationKind; className?: string } & Omit<SVGProps<SVGSVGElement>, "children">) {
  return <svg {...props} className={\`md-illustration \${className}\`.trim()} viewBox="0 0 96 72" fill="none" aria-hidden="true" focusable="false"><Motif kind={kind}/></svg>;
}
`;
          write('components/ui/MadarIllustration.tsx',illustration);

          let css=read('app/visual-language-assets-8.css');
          if(!css.includes('MADAR illustrative language runtime')) css += `

/* MADAR illustrative language runtime — conceptual artwork, not functional UI icons. */
.md-illustration { display:block; width:clamp(4.75rem,8vw,6rem); height:auto; max-width:100%; overflow:visible; }
.md-illustration-primary,.md-illustration-secondary,.md-illustration-node { vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round; }
.md-illustration-primary { fill:none; stroke:var(--md-mint); stroke-width:2; }
.md-illustration-secondary { fill:none; stroke:var(--md-text-secondary); stroke-width:1.6; }
.md-illustration-node { fill:var(--md-surface-sunken); stroke:var(--md-mint); stroke-width:1.6; }
@media (max-width:389px) { .md-illustration { width:4.75rem; } }
@media (forced-colors:active) { .md-illustration-primary,.md-illustration-secondary,.md-illustration-node { stroke:CanvasText; } .md-illustration-node { fill:Canvas; } }
`;
          write('app/visual-language-assets-8.css',css);

          let tests=read('tests/madar-visual-language-asset-system-8.test.mjs');
          if(!tests.includes('eight Home concept placements')) tests += `

test("active functional surfaces converge on the shared icon system", async () => {
  const theme = await text("components/theme/ThemeToggle.tsx");
  assert.match(theme, /@\\/components\\/ui\\/Icons/);
  assert.match(theme, /name="sun"/);
  assert.match(theme, /name="moon"/);
  assert.doesNotMatch(theme, /<svg\\b/);
  const roots = ["app", "components", "src"];
  const { readdir } = await import("node:fs/promises");
  const { join } = await import("node:path");
  const offenders = [];
  async function walk(dir) {
    for (const entry of await readdir(dir, { withFileTypes: true })) {
      const full = join(dir, entry.name);
      if (entry.isDirectory()) await walk(full);
      else if (/\\.(?:ts|tsx)$/.test(entry.name)) {
        const source = await text(full);
        if (/from ["']lucide-react["']/.test(source)) offenders.push(full);
      }
    }
  }
  for (const root of roots) await walk(root);
  assert.deepEqual(offenders, [], `direct lucide-react consumers: ${offenders.join(", ")}`);
});

test("MADAR illustrative language is implemented on the eight Home concept placements", async () => {
  const [illustrations, why, categories, css] = await Promise.all([text("components/ui/MadarIllustration.tsx"), text("components/home/WhyMadar.tsx"), text("components/home/Categories.tsx"), text("app/visual-language-assets-8.css")]);
  for (const motif of ["operations", "automation", "intelligence", "security"]) assert.ok(illustrations.includes(`kind === "${motif}"`) || illustrations.includes(`return "${motif}"`), motif);
  assert.match(illustrations, /viewBox="0 0 96 72"/);
  assert.match(illustrations, /aria-hidden="true"/);
  assert.match(illustrations, /focusable="false"/);
  assert.doesNotMatch(illustrations, /#[0-9a-f]{3,8}/i);
  assert.equal((why.match(/<MadarIllustration /g) || []).length, 4);
  assert.equal((categories.match(/<MadarIllustration /g) || []).length, 4);
  assert.doesNotMatch(why, /<Icon\\b/);
  assert.doesNotMatch(categories, /<Icon\\b/);
  assert.match(css, /\\.md-illustration-primary/);
  assert.match(css, /var\\(--md-mint\\)/);
  assert.match(css, /var\\(--md-text-secondary\\)/);
  assert.doesNotMatch(css, /#[0-9a-f]{3,8}|slate-|violet-|emerald-/i);
});
`;
          write('tests/madar-visual-language-asset-system-8.test.mjs',tests);

          let doc=read('docs/MADAR_VISUAL_LANGUAGE_ASSET_SYSTEM_8.md');
          if(!doc.includes('Completion recovery audit — 2026-08-16')) doc += `

## 15. Completion recovery audit — 2026-08-16

تم استئناف المرحلة من \`main\` عند \`6f8d4c219deb59f45e3cf1b7b4b689b7221a87be\` دون إعادة تنفيذ الأجزاء الصحيحة.

| المحور | حالة الاستئناف | الإغلاق التنفيذي |
|---|---|---|
| UI Functional Icons | Implemented مع فجوة صغيرة | النظام المركزي كان مستخدمًا فعليًا؛ أزيل تكرار Sun/Moon الوظيفي في Theme Toggle وربط بـ\`components/ui/Icons.tsx\`. يثبت gate عدم وجود direct \`lucide-react\` imports داخل \`app/components/src\`. |
| MADAR Illustrative Language | Partially implemented / documentation-heavy | أصبح له runtime component فعلي في \`components/ui/MadarIllustration.tsx\`: أربعة motifs خفيفة، واستُبدلت 8 مواضع concept artwork في Home (4 WhyMadar + 4 Categories) بدل UI icons المكبرة. |
| Images / Visual Assets | Implemented مع binary delivery corruption | أُعيدت مشتقات WebP الأربع من Git blobs الصحيحة، مع gate يثبت RIFF/WEBP + dimensions + SHA-256. |

### التنفيذ الرسومي الفعلي
- **Duotone Line:** منفذ عبر \`md-illustration-primary\` و\`md-illustration-secondary\` بألوان semantic الحالية.
- **Geometric Minimal:** منفذ في motifs العمليات/الاتصال، الأتمتة، الذكاء، والأمان باستخدام nodes/flows/layers/perimeter.
- **Soft 3D:** لم تُنشأ رسوم 3D جديدة؛ Masters الرسمية للخدمات وORBY هي الـaccent الثلاثي الأبعاد المعتمد، وإضافة المزيد لم تكن مبررة.
- الرسومات الجديدة decorative بجوار عنوان وشرح نصي، لذلك تستخدم \`aria-hidden\` و\`focusable=false\` ولا تعتمد على اللون وحده.
- لا animation ولا dependency جديدة.

### Binary recovery
لم يتم تغيير hashes أو إسكات الاختبار. استُعيدت bytes الصحيحة من Git blob objects، ثم تحقق الحجم و\`RIFF\`/\`WEBP\` وSHA-256 قبل الاختبارات والـcommit. ملفات WebP النهائية ليست Base64 text representations.
`;
          write('docs/MADAR_VISUAL_LANGUAGE_ASSET_SYSTEM_8.md',doc);

          let registry=read('docs/MADAR_ASSET_REGISTRY.md');
          if(!registry.includes('Runtime illustration implementation')) registry += `

## Runtime illustration implementation
المرجع التنفيذي للـCore Illustration Language هو \`components/ui/MadarIllustration.tsx\` مع قواعد العرض في \`app/visual-language-assets-8.css\`. الاستخدام المقصود الأول هو 8 concept placements في \`components/home/WhyMadar.tsx\` و\`components/home/Categories.tsx\`. Functional UI icons تبقى في \`components/ui/Icons.tsx\` ولا تستبدلها الرسومات في Search/Cart/Copy/Retry/Send/Menu/Settings/Edit ونحوها.
`;
          write('docs/MADAR_ASSET_REGISTRY.md',registry);

          let ci=read('.github/workflows/ci.yml');
          ci=ci.replace(/\n      - name: Restore verified Phase 8 binary assets\n[\s\S]*?(?=\n      - name: Patch immutable ORBY OS scope keys)/,'');
          if(ci.includes('Restore verified Phase 8 binary assets')) throw new Error('temporary CI recovery step remained');
          write('.github/workflows/ci.yml',ci);
          NODE
      - name: Phase 8 gate preflight
        run: node --test tests/madar-visual-language-asset-system-8.test.mjs
      - name: Prepare and push final scoped commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/phase8-completion.yml .github/workflows/phase8-completion-v2.yml .github/workflows/phase8-completion-v3.yml
          git config user.name "madarorbit"
          git config user.email "orbit.ops.digital@gmail.com"
          git add .github/workflows/ci.yml app/visual-language-assets-8.css components/home/WhyMadar.tsx components/home/Categories.tsx components/theme/ThemeToggle.tsx components/ui/MadarIllustration.tsx docs/MADAR_ASSET_REGISTRY.md docs/MADAR_VISUAL_LANGUAGE_ASSET_SYSTEM_8.md tests/madar-visual-language-asset-system-8.test.mjs public/assets/services/connected-business-master.webp public/assets/services/native-business-master.webp public/assets/services/madar-retail-master.webp public/assets/orby/orby-master.webp
          git diff --cached --check
          git commit -m "fix(visual): close MADAR visual asset system 8.0"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Full tests
        run: npm test
      - name: ORBY OS smoke suite
        run: npm run orby:os-smoke
      - name: ORBY OS security suite
        run: npm run orby:os-security
      - name: ORBY OS load suite
        run: npm run orby:os-load
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

name: Fix V2 release migrations
on:
  push:
    branches: [codex/madar-v2-db-release-fix]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/madar-v2-db-release-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-v2-release-migrations.mjs
      - name: Commit corrected migrations
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "madarorbit"
          git config user.email "orbit.ops.digital@gmail.com"
          git add supabase/migrations/20260802090000_madar_v2_p0_p11_platform.sql supabase/migrations/20260804110000_orby_v2_o4_o7_completion.sql
          git commit -m "fix(v2): make release migrations production-compatible"
          git push origin HEAD:codex/madar-v2-db-release-fix

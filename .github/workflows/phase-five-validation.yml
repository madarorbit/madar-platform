name: التحقق من التحول المؤسسي

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/madar-store-engine]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-five-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: الاختبارات والتحليل والبناء
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://madar-platform-ten.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoiYW5vbiJ9.signature
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.signature
      SUPER_ADMIN_EMAIL: orbit.ops.digital@gmail.com
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: إعداد بيئة التشغيل
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: تشغيل التحقق الكامل وتسجيل النتيجة
        shell: bash
        run: |
          set +e
          mkdir -p validation/logs

          npm ci > validation/logs/install.log 2>&1
          INSTALL=$?

          if [ "$INSTALL" -eq 0 ]; then
            npm test > validation/logs/test.log 2>&1; TEST=$?
            npm run lint > validation/logs/lint.log 2>&1; LINT=$?
            npx next typegen > validation/logs/typegen.log 2>&1; TYPEGEN=$?
            npm run typecheck > validation/logs/typecheck.log 2>&1; TYPECHECK=$?
            npm run build > validation/logs/build.log 2>&1; BUILD=$?
          else
            TEST=99; LINT=99; TYPEGEN=99; TYPECHECK=99; BUILD=99
          fi

          if [ "$INSTALL" -eq 0 ] && [ "$TEST" -eq 0 ] && [ "$LINT" -eq 0 ] && [ "$TYPEGEN" -eq 0 ] && [ "$TYPECHECK" -eq 0 ] && [ "$BUILD" -eq 0 ]; then
            RESULT=success
          else
            RESULT=failure
          fi

          cat > validation/store-engine-status.json <<EOF
          {
            "result": "$RESULT",
            "commit": "${GITHUB_SHA}",
            "install": $INSTALL,
            "test": $TEST,
            "lint": $LINT,
            "typegen": $TYPEGEN,
            "typecheck": $TYPECHECK,
            "build": $BUILD
          }
          EOF

          {
            echo "MADAR Store Engine validation: $RESULT"
            for FILE in install test lint typegen typecheck build; do
              echo
              echo "===== $FILE ====="
              tail -n 120 "validation/logs/$FILE.log" 2>/dev/null || true
            done
          } > validation/store-engine-diagnostics.txt

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "agent/madar-store-engine" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation/store-engine-status.json validation/store-engine-diagnostics.txt
            git commit -m "chore: record store engine validation [skip ci]" || true
            git push origin HEAD:agent/madar-store-engine
          fi

          if [ "$RESULT" != "success" ]; then exit 1; fi
